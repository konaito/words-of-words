<style>
/* 960x540 の固定ステージ。扉・選ぶ・広がる・結果の4面を切り替える。白に近い地に、種語ごとのパステル8色 */
:root {
  --bg: #f7f5f1;
  --panel: #ffffff;
  --line: #e6e1d8;
  --ink: #1f2937;
  --sub: #6b7280;
  --mute: #a3a3a3;
  --blue: #4a86e0;
  --blue-soft: #e7effb;
  --green: #1f7a5c;
  --off: #c9c3b8;
  --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --round: ui-rounded, "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --hand: "Bradley Hand", "Segoe Print", "Comic Sans MS", cursive;
  color-scheme: light;
}
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
#viewport { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#stage { position: absolute; left: 0; top: 0; width: 960px; height: 540px; transform-origin: 0 0; background: var(--bg); font-family: var(--font); font-size: 14px; line-height: 1.6; overflow: hidden; }
.screen { position: absolute; inset: 0; }
[hidden] { display: none !important; }
button { font: inherit; color: var(--ink); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 0 20px; height: 42px; box-shadow: 0 1px 2px rgba(31, 41, 55, 0.06); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; box-shadow: 0 6px 14px rgba(74, 134, 224, 0.28); }
.btn.primary:disabled { background: #b9c6d8; border-color: #b9c6d8; box-shadow: none; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.lang { display: flex; background: #efebe4; border-radius: 10px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: transparent; border-radius: 8px; font-size: 12px; padding: 0 10px; height: 24px; color: var(--sub); }
.lang button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(31, 41, 55, 0.1); }
.gloss { color: var(--sub); font-size: 0.78em; font-weight: 400; }
.mascot { position: absolute; width: 64px; height: 76px; }

/* 共通ヘッダー */
.top { position: absolute; left: 0; right: 0; top: 0; height: 60px; display: flex; align-items: center; padding: 0 28px; gap: 14px; }
.top .back { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 8px; font-size: 20px; line-height: 1; color: var(--ink); }
.top .back:hover { background: #ece8e1; }
.top .brand { border: 0; background: transparent; font-size: 15px; color: var(--sub); padding: 0; }
.steps { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 22px; list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); white-space: nowrap; }
.steps li .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--off); display: grid; place-items: center; font-size: 13px; font-family: var(--round); }
.steps li.on { color: var(--blue); font-weight: 700; }
.steps li.on .n { background: var(--blue); border-color: var(--blue); color: #fff; }
.top .lang { margin-left: auto; }

/* 扉 */
#door .corner { position: absolute; top: 18px; right: 30px; font-size: 12px; color: var(--sub); }
#door .copy { position: absolute; left: 64px; top: 64px; width: 380px; }
#door h1 { margin: 0; font-family: var(--round); font-size: 48px; line-height: 1.1; letter-spacing: 0.005em; }
#door h2 { margin: 22px 0 0; font-size: 23px; line-height: 1.5; font-weight: 700; }
#door p { margin: 14px 0 0; font-size: 13.5px; line-height: 1.9; color: var(--sub); }
#door .acts { display: flex; flex-direction: column; gap: 12px; width: 236px; margin-top: 24px; }
#door .acts .btn { height: 46px; font-size: 15px; display: flex; align-items: center; justify-content: center; position: relative; }
#door .acts .primary::after { content: "›"; position: absolute; right: 18px; font-size: 20px; font-weight: 400; }
#door .lang { position: absolute; left: 64px; bottom: 30px; }
.deck { position: absolute; left: 500px; top: 70px; width: 380px; height: 300px; }
.deck .c { position: absolute; width: 230px; height: 170px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 10px 24px rgba(31, 41, 55, 0.08); font-family: var(--round); color: #c9ced8; font-size: 22px; line-height: 34px; display: flex; align-items: flex-start; justify-content: flex-end; padding: 0 18px; box-sizing: border-box; }
.deck .c1 { left: 150px; top: 0; transform: rotate(6deg); }
.deck .c2 { left: 128px; top: 34px; transform: rotate(4deg); }
.deck .c3 { left: 108px; top: 70px; transform: rotate(2deg); }
.deck .front { left: 0; top: 80px; width: 214px; height: 186px; transform: rotate(-4deg); color: var(--ink); flex-direction: column; align-items: center; justify-content: center; line-height: 1.3; padding: 0 18px; text-align: center; box-shadow: 0 16px 30px rgba(31, 41, 55, 0.12); }
.deck .front b { font-size: 34px; }
.deck .front span { font-family: var(--font); font-size: 12.5px; line-height: 1.6; color: var(--sub); margin-top: 10px; }
#door .mascot { left: 560px; top: 356px; }
#door .tag { position: absolute; right: 52px; bottom: 44px; font-family: var(--hand); font-size: 16px; line-height: 1.5; color: var(--sub); transform: rotate(-6deg); text-align: right; }

/* 遊び方 */
#howto { position: absolute; inset: 0; background: rgba(31, 41, 55, 0.25); display: grid; place-items: center; z-index: 10; }
#howto[hidden] { display: none; }
#howto .box { width: 620px; background: var(--panel); border-radius: 18px; padding: 26px 30px 22px; box-shadow: 0 20px 40px rgba(31, 41, 55, 0.18); }
#howto h3 { margin: 0 0 12px; font-size: 18px; }
#howto ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
#howto li { display: grid; grid-template-columns: 28px 1fr; gap: 4px 10px; }
#howto li .n { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; font-family: var(--round); font-size: 13px; }
#howto li b { font-size: 14.5px; }
#howto li p { margin: 0; font-size: 13px; line-height: 1.75; color: var(--sub); }
#howto .end { display: flex; justify-content: flex-end; margin-top: 16px; }

/* 選ぶ */
#desk h1 { position: absolute; left: 48px; top: 74px; margin: 0; font-size: 23px; }
#desk .lead { position: absolute; left: 48px; top: 112px; margin: 0; font-size: 13px; color: var(--sub); }
.search { position: absolute; left: 48px; top: 146px; width: 552px; height: 40px; box-sizing: border-box; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
.search svg { flex: none; }
.search input { border: 0; outline: 0; font: inherit; font-size: 14px; flex: 1; background: transparent; color: var(--ink); }
.search input::placeholder { color: var(--mute); }
.cards { position: absolute; left: 48px; top: 200px; width: 552px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.card { height: 50px; border: 1px solid transparent; background: #efebe4; border-radius: 12px; padding: 0 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.25; overflow: hidden; }
.card .w { font-size: 14.5px; max-width: 100%; overflow: hidden; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card.long .w { font-size: 12px; }
.card .gloss { font-size: 10.5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card:hover:not([aria-disabled="true"]) { background: #e8e3da; }
.card[aria-pressed="true"] { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); font-weight: 700; }
.card[aria-pressed="true"] .gloss { color: var(--blue); }
.card[aria-disabled="true"] { opacity: 0.45; cursor: default; }
.empty-msg { grid-column: 1 / -1; font-size: 13px; color: var(--sub); padding: 12px 2px; }
.count { position: absolute; right: 52px; top: 84px; font-family: var(--round); font-size: 15px; }
.count b { font-size: 20px; }
.picked { position: absolute; left: 652px; top: 120px; width: 260px; height: 268px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
.picked .h { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 10px; }
.picked .h span { font-weight: 400; color: var(--sub); }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot { height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); padding: 0 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; overflow: hidden; }
.slot .w { font-size: 14px; font-weight: 700; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot .gloss { font-size: 10.5px; }
.slot.empty { color: var(--off); font-size: 22px; font-weight: 300; border-style: dashed; }
.startbtn { position: absolute; left: 652px; top: 404px; width: 260px; height: 50px; font-size: 15px; }

/* 広がる */
#fill h1 { position: absolute; left: 44px; top: 74px; margin: 0; font-size: 22px; }
#fill .lead { position: absolute; left: 44px; top: 110px; margin: 0; font-size: 12.5px; color: var(--sub); white-space: nowrap; }
.legend { position: absolute; left: 36px; top: 150px; width: 184px; list-style: none; margin: 0; padding: 0; }
.legend li { display: flex; align-items: center; gap: 8px; height: 31px; padding: 0 10px; border-radius: 9px; font-size: 14px; color: var(--sub); }
.legend li .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; opacity: 0.4; }
.legend li .w { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.legend li .plus { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; color: var(--mute); white-space: nowrap; }
.legend li.done { color: var(--ink); }
.legend li.done .dot, .legend li.now .dot { opacity: 1; }
.legend li.now { background: #ece8e1; color: var(--ink); font-weight: 700; }
.field { position: absolute; left: 236px; top: 138px; width: 696px; height: 330px; }
.field canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.node { position: absolute; transform: translate(-7px, -50%); display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; white-space: nowrap; background: rgba(255, 255, 255, 0.85); border-radius: 8px; padding: 1px 7px 1px 3px; opacity: 0; transition: opacity 300ms; pointer-events: none; }
.node i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; }
.node.on { opacity: 1; }
#fill .mascot { left: 34px; top: 444px; }
.bubble { position: absolute; left: 104px; top: 448px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 6px 14px; font-size: 12.5px; white-space: nowrap; }
.ticker { position: absolute; left: 252px; top: 482px; width: 400px; font-size: 11.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker b { color: var(--ink); }
.status { position: absolute; right: 28px; top: 474px; display: flex; align-items: center; gap: 10px; }
.status .pill { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--sub); white-space: nowrap; }
.status .pill b { color: var(--ink); font-family: var(--round); font-size: 15px; font-variant-numeric: tabular-nums; }
.status .btn { height: 40px; font-size: 13px; }

/* 結果 */
#result h1 { position: absolute; left: 44px; top: 70px; margin: 0; font-size: 25px; white-space: nowrap; }
#result h1 .num { font-family: var(--round); font-size: 34px; color: var(--green); margin-right: 2px; }
#result .lead { position: absolute; left: 44px; top: 120px; margin: 0; font-size: 13px; color: var(--sub); }
.chips { position: absolute; left: 44px; top: 156px; width: 600px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.chips span { height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; font-size: 16px; font-weight: 700; overflow: hidden; }
.chips span .gloss { font-size: 10.5px; color: inherit; opacity: 0.8; }
.refs { position: absolute; left: 44px; top: 264px; width: 600px; box-sizing: border-box; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 14px 6px; }
.refs h3 { margin: 0 0 2px; font-size: 12.5px; }
.refs ol { list-style: none; margin: 0; padding: 0; }
.refs li { display: flex; align-items: baseline; gap: 10px; padding: 5px 6px; border-top: 1px solid #f0ece5; font-size: 11.5px; border-radius: 6px; }
.refs li .name { min-width: 0; flex: 1; }
.refs li .name small { display: block; color: var(--sub); font-size: 10.5px; }
.refs li .val { white-space: nowrap; font-variant-numeric: tabular-nums; }
.refs li .val span { color: var(--sub); margin-left: 4px; }
.refs li.match { background: var(--blue-soft); }
.donut { position: absolute; left: 690px; top: 72px; width: 210px; height: 210px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; line-height: 1.3; }
.donut .in b { font-family: var(--round); font-size: 34px; }
.donut .in span { font-size: 12.5px; font-variant-numeric: tabular-nums; }
.donut .in small { font-size: 11px; color: var(--sub); }
.rbtns { position: absolute; left: 676px; top: 306px; width: 240px; display: flex; gap: 10px; }
.rbtns .btn { flex: 1; padding: 0 8px; font-size: 13px; height: 44px; }
.toast { position: absolute; left: 676px; top: 356px; width: 240px; text-align: center; font-size: 12px; color: var(--green); }
.meaning { position: absolute; left: 44px; top: 474px; width: 600px; margin: 0; font-size: 12px; line-height: 1.6; }
.credit { position: absolute; left: 44px; top: 500px; font-size: 10.5px; color: var(--sub); }
#result .mascot { left: 852px; top: 444px; }
@media (prefers-reduced-motion: reduce) { .node { transition: none; } }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="mascot" viewBox="0 0 64 76">
        <path d="M9 7l4 6M18 3l1 7M27 6l-3 6" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M14 70C9 50 10 22 31 18c18-3 24 16 23 34-1 9 3 15-1 17-4 2-6-3-10-1s-6 5-10 2-7 2-19 0z" fill="#fff" stroke="#2b2b2b" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="31" cy="36" r="2.4" fill="#2b2b2b"/><circle cx="41" cy="35" r="2.4" fill="#2b2b2b"/>
        <path d="M34 42q2.5 2 5 0" stroke="#2b2b2b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M51 46c5-1 7 3 5 6" stroke="#2b2b2b" stroke-width="2" fill="none" stroke-linecap="round"/>
      </symbol>
    </svg>

    <section class="screen" id="door">
      <div class="corner">Words of Words</div>
      <div class="copy">
        <h1>Words of Words</h1>
        <h2 id="door-head"></h2>
        <p id="door-body"></p>
        <div class="acts">
          <button class="btn primary" id="to-desk" type="button" data-t="start"></button>
          <button class="btn" id="howto-open" type="button" data-t="howto"></button>
        </div>
      </div>
      <div class="deck" aria-hidden="true">
        <div class="c c1">connect</div><div class="c c2">dominate</div><div class="c c3">understand</div>
        <div class="c front"><b>word</b><span>a unit of language that native speakers can identify</span></div>
      </div>
      <svg class="mascot" aria-hidden="true"><use href="#mascot"/></svg>
      <div class="tag" id="door-tag"></div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">English</button>
      </div>
      <div id="howto" hidden role="dialog" aria-modal="true" aria-labelledby="howto-title">
        <div class="box">
          <h3 id="howto-title" data-t="howto"></h3>
          <ol id="chapters"></ol>
          <div class="end"><button class="btn" id="howto-close" type="button" data-t="close"></button></div>
        </div>
      </div>
    </section>

    <header class="top" id="top" hidden>
      <button class="back" id="back" type="button" aria-label="Back">←</button>
      <button class="brand" id="brand" type="button">Words of Words</button>
      <ol class="steps" id="steps"></ol>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">English</button>
      </div>
    </header>

    <section class="screen" id="desk" hidden>
      <h1 data-t="deskTitle"></h1>
      <p class="lead" data-t="deskLead"></p>
      <div class="count"><b id="count-n">0</b> / 8</div>
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="#6b7280" stroke-width="1.6" fill="none"/><path d="M11 11l3.5 3.5" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false" lang="en">
      </label>
      <div class="cards" id="cards" role="group"></div>
      <div class="picked">
        <div class="h"><b data-t="picked"></b><span id="picked-n"></span></div>
        <div class="slots" id="slots"></div>
      </div>
      <button class="btn primary startbtn" id="open" type="button"></button>
    </section>

    <section class="screen" id="fill" hidden>
      <h1 id="fill-title"></h1>
      <p class="lead" data-t="fillLead"></p>

        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle cx="100" cy="100" r="84" fill="none" stroke="#ebe7e0" stroke-width="18"/>

      <div class="toast" id="toast" aria-live="polite"></div>
      <p class="meaning" data-t="meaning"></p>
      <div class="credit" data-t="credit"></div>
      <svg class="mascot" aria-hidden="true"><use href="#mascot"/></svg>
    </section>
  </div>
</div>

<script src="engine.js"></script>
<script>
(() => {
  const TOTAL = 127223, SLOTS = 8;
  const BEST = ["move", "use", "person", "place", "cause", "time", "language", "quality"];
  const REFS = [
    { key: "refBest", n: 94836, best: true },
    { key: "refBasic", n: 97689 },
    { key: "refThing", n: 97924 },
    { key: "refAll", seeds: 1458 },
  ];
  // 候補30語。並びは固定で混ぜてある

  // 種語ごとの色。波0（機能語だけで読める語）は灰色

  const T = {

      deskTitle: "Choose 8 seed words",
      deskLead: "We count how many dictionary entries your 8 words can reach.",

      searchLoading: "Loading the dictionary.",
      noHit: "No matching entry. Function words (the, of, have…) are known from the start and cannot be chosen.",
      picked: "Your seeds",
      open: "Start with these 8 →",
      openLeft: (n) => `${n} more to go`,
      fillTitle: "Words are spreading…", fillTitleDone: "This is how far they spread",
      fillLead: "Following definitions out from your seeds into the dictionary.",
      bubble: "Spreading out!", bubbleDone: "Look how far!",
      loading: "Opening the dictionary.",
      loadErr: "The dictionary data could not be loaded. Reload the page to try again.",
      exploring: "Exploring…", reached: "Reached",
      words: (n) => `${n} entries`,
      skip: "Skip", toResult: "Result →",
      seedTag: "seed",
      resTitle: (n) => `Reached <span class="num">${n}</span> entries!`,
      resLead: (p) => `From your 8 seeds you reached ${p} of the dictionary's headwords.`,
      headwords: "headwords",
      refsTitle: "Compared with other sets",
      refBest: "move, use, person, place, cause, time, language, quality",
      bestNote: "remove any one and it falls to 1,318 or fewer",
      refBasic: "Basic English (781 words, function words removed)",
      refThing: "Thing Explainer (788 words, function words and inflections removed)",
      refAll: "Seeds needed to reach every entry (greedy)",
      refVal: (n, p) => `${n}<span>(${p})</span>`,
      refSeeds: (n) => `${n} words<span>(100%)</span>`,
      again: "Play again", share: "Share",
      shareText: (n, p, w) => `On Words of Words, my 8 seeds (${w}) reached ${n} entries (${p}) of an English dictionary.`,
      copied: "Copied the result text.", copyFail: "Could not copy.",
      meaning: "Reached means the definition strings could be followed, not that the meaning was understood.",
      credit: "Dictionary: Open English WordNet 2025 (CC BY 4.0)",
    },
  };

  const $ = (id) => document.getElementById(id);
  const state = { lang: "ja", screen: "door", picks: [], focus: 0, query: "" };
  const t = (k) => T[state.lang][k];
  const fmt = (n) => n.toLocaleString("en-US");
  const pct = (n) => (n / TOTAL * 100).toFixed(1) + "%";
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const gloss = (w) => (state.lang === "ja" && GLOSS[w] ? `<span class="gloss">（${GLOSS[w]}）</span>` : "");
  const tint = (c, a) => `color-mix(in srgb, ${c} ${a}%, white)`;

  // ---------- 拡大: 整数倍で中央に置く。960x540 に満たないときだけ縮小する ----------
  const stage = $("stage");
  function fit() {
    const W = window.innerWidth, H = window.innerHeight;
    const r = Math.min(W / 960, H / 540);
    const s = r >= 1 ? Math.floor(r) : r;
    stage.style.transform = `scale(${s})`;
    stage.style.left = Math.round((W - 960 * s) / 2) + "px";
    stage.style.top = Math.max(0, Math.round((H - 540 * s) / 2)) + "px";
  }
  window.addEventListener("resize", fit);

  // ---------- 辞書データ ----------
  let G = null, DEFS = null, wsyn = null;
  const dataReady = fetch("graph.txt").then((r) => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then((txt) => {
      G = DictEngine.parseGraph(txt);
      // 表示用: 語 -> その語をメンバーに持つ語義
      const cnt = new Int32Array(G.nw + 1);
      for (let i = 0; i < G.mem.data.length; i++) cnt[G.mem.data[i] + 1]++;
      for (let w = 0; w < G.nw; w++) cnt[w + 1] += cnt[w];
      const data = new Int32Array(G.mem.data.length), fillp = cnt.slice(0, G.nw);
      for (let s = 0; s < G.ns; s++)
        for (let i = G.mem.off[s]; i < G.mem.off[s + 1]; i++) data[fillp[G.mem.data[i]]++] = s;
      wsyn = { off: cnt, data };
      fetch("defs.txt").then((r) => (r.ok ? r.text() : null)).then((d) => { if (d) DEFS = d.split("\n"); }).catch(() => {});
      if (state.screen === "desk" && state.query) renderCards();
      return G;
    });
  dataReady.catch(() => {});

  // ---------- 画面切り替え ----------
  const STEP = { desk: 0, fill: 1, result: 2 };
  function go(screen) {
    state.screen = screen;
    for (const id of ["door", "desk", "fill", "result"]) $(id).hidden = id !== screen;
    $("top").hidden = screen === "door";
    if (screen !== "door") $("howto").hidden = true;
    if (screen !== "fill") stopFill();
    render();
    if (screen === "door") $("to-desk").focus();
    if (screen === "desk") focusCard(state.focus);
    if (screen === "result") $("share").focus();
  }

  function render() {
    document.documentElement.lang = state.lang;
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === state.lang));
    document.querySelectorAll("[data-t]").forEach((el) => { const v = t(el.dataset.t); if (typeof v === "string") el.textContent = v; });
    $("steps").innerHTML = t("steps").map((s, i) =>
      `<li class="${STEP[state.screen] === i ? "on" : ""}"><span class="n">${i + 1}</span>${s}</li>`).join("");
    renderDoor();
    renderDesk();
    if (state.screen === "fill") renderFillStatic();
    if (state.screen === "result") renderResult();
  }

  // ---------- 扉 ----------
  function renderDoor() {
    $("door-head").innerHTML = t("doorHead");
    $("door-body").innerHTML = t("doorBody");
    $("door-tag").innerHTML = t("doorTag");
    $("chapters").innerHTML = t("chapters").map(([h, p], i) =>
      `<li><span class="n">${i + 1}</span><b>${h}</b><p>${p}</p></li>`).join("");
  }
  $("to-desk").onclick = () => go("desk");
  $("howto-open").onclick = () => { $("howto").hidden = false; $("howto-close").focus(); };
  $("howto-close").onclick = () => { $("howto").hidden = true; $("howto-open").focus(); };
  $("howto").addEventListener("click", (e) => { if (e.target.id === "howto") $("howto-close").click(); });

  // ---------- 選ぶ ----------
  function list() {
    const q = state.query.trim().toLowerCase();
    if (!q) return CANDS;
    if (!G) return null;
    const hits = [];
    for (const w of G.words) if (w.startsWith(q)) hits.push(w);
    hits.sort((a, b) => a.length - b.length || (a < b ? -1 : 1));
    return hits.slice(0, 30);
  }
  function renderCards() {
    const full = state.picks.length >= SLOTS, L = list();
    if (L === null) { $("cards").innerHTML = `<div class="empty-msg">${esc(t("searchLoading"))}</div>`; return; }
    if (!L.length) { $("cards").innerHTML = `<div class="empty-msg">${esc(t("noHit"))}</div>`; return; }
    state.focus = Math.min(state.focus, L.length - 1);
    $("cards").innerHTML = L.map((w, i) => {
      const placed = state.picks.includes(w);
      return `<button type="button" class="card${w.length > 10 ? " long" : ""}" data-w="${esc(w)}" data-i="${i}" tabindex="${i === state.focus ? 0 : -1}" aria-pressed="${placed}" ${!placed && full ? 'aria-disabled="true"' : ""}><span class="w" lang="en">${esc(w)}</span>${gloss(w)}</button>`;
    }).join("");
  }
  function renderDesk() {
    $("q").placeholder = t("search");
    renderCards();
    const slots = [];
    for (let i = 0; i < SLOTS; i++) {
      const w = state.picks[i];
      slots.push(w ? `<button type="button" class="slot" data-w="${esc(w)}"><span class="w" lang="en">${esc(w)}</span>${gloss(w)}</button>`
        : `<button type="button" class="slot empty" aria-label="empty">+</button>`);
    }
    $("slots").innerHTML = slots.join("");
    const n = state.picks.length;
    $("count-n").textContent = n;
    $("picked-n").textContent = `${n} / ${SLOTS}`;
    $("open").disabled = n < SLOTS;
    $("open").textContent = n < SLOTS ? t("openLeft")(SLOTS - n) : t("open");
  }
  function focusCard(i) {
    const cards = $("cards").querySelectorAll(".card");
    if (!cards.length) return;
    state.focus = Math.max(0, Math.min(cards.length - 1, i));
    cards.forEach((c, j) => c.tabIndex = j === state.focus ? 0 : -1);
    cards[state.focus].focus();
  }
  function toggle(w, refocus = true) {
    const i = state.picks.indexOf(w);
    if (i >= 0) state.picks.splice(i, 1);
    else if (state.picks.length < SLOTS) state.picks.push(w);
    else return;
    renderDesk();
    if (state.picks.length === SLOTS) $("open").focus();
    else if (refocus) focusCard(state.focus);
  }
  $("cards").addEventListener("click", (e) => {
    const b = e.target.closest(".card"); if (!b) return;
    state.focus = +b.dataset.i;
    toggle(b.dataset.w);
  });
  $("cards").addEventListener("keydown", (e) => {
    const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -6, ArrowDown: 6 }[e.key];
    if (d === undefined) return;
    e.preventDefault();
    const n = state.focus + d;
    if (n < 0 && e.key === "ArrowUp") { $("q").focus(); return; }
    if (n >= 0 && n < $("cards").children.length) focusCard(n);
  });
  $("slots").addEventListener("click", (e) => {
    const b = e.target.closest(".slot"); if (!b) return;
    if (!b.dataset.w) { $("q").focus(); return; }
    toggle(b.dataset.w, false);
  });
  $("q").addEventListener("input", (e) => { state.query = e.target.value; state.focus = 0; renderCards(); });
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const first = $("cards").querySelector(".card");
      if (first) { toggle(first.dataset.w, false); $("q").focus(); }
    } else if (e.key === "ArrowDown") { e.preventDefault(); focusCard(0); }
    else if (e.key === "Escape" && state.query) {
      e.preventDefault(); e.stopPropagation();
      state.query = e.target.value = ""; renderCards();
    }
  });
  $("open").onclick = () => openBook();

  // ---------- 広がる ----------
  const CW = 696, CH = 330, DPR = 2;
  const cv = $("cv"), cx = cv.getContext("2d");
  let run = null; // 実行中の演出
  function openBook() {
    if (state.picks.length < SLOTS) return;
    go("fill");
    cx.clearRect(0, 0, cv.width, cv.height);
    $("field").querySelectorAll(".node").forEach((n) => n.remove());
    $("ticker").textContent = t("loading");
    setHud(0, -1);
    $("fill-btn").disabled = true;
    dataReady.then(() => {
      if (state.screen !== "fill") return;
      if (!state.picks.every((w) => G.index.has(w))) { state.picks = state.picks.filter((w) => G.index.has(w)); go("desk"); return; }
      startFill();
    })
      .catch(() => { $("ticker").textContent = t("loadErr"); });
  }

  function mulberry(a) {
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let x = Math.imul(a ^ a >>> 15, 1 | a); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; };
  }

  function startFill() {
    const ids = state.picks.map((w) => G.index.get(w));
    const res = DictEngine.closure(G, ids);
    // 波の区切り: 先頭 i 語で閉じたときの到達数（engine の戻り値そのまま）
    const bounds = [res.base];
    for (let i = 1; i <= SLOTS; i++) bounds.push(i === SLOTS ? res.count : DictEngine.closure(G, ids.slice(0, i)).count);
    const pos = new Int32Array(G.nw).fill(-1);
    res.order.forEach((w, i) => { pos[w] = i; });
    const seedAt = new Set();
    for (let i = 0; i < SLOTS; i++) if (pos[ids[i]] === bounds[i]) seedAt.add(ids[i]);
    // 点の配置は見た目だけ。種語ごとに円周上の中心を置き、到達数に応じた雲を描く
    let h = 7; for (const ch of state.picks.join(" ")) h = Math.imul(h ^ ch.charCodeAt(0), 2654435761);
    const rnd = mulberry(h);
    const centers = [[CW / 2, CH / 2]];
    for (let i = 0; i < SLOTS; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / SLOTS + (rnd() - 0.5) * 0.35;
      centers.push([CW / 2 + Math.cos(a) * CW * 0.34, CH / 2 + Math.sin(a) * CH * 0.34]);
    }
    const clouds = [];
    for (let k = 0; k <= SLOTS; k++) {
      const n = bounds[k] - (k ? bounds[k - 1] : 0);
      const nd = n <= 0 ? 0 : Math.round(Math.min(n, 4 + 14 * Math.sqrt(n)));
      const R = Math.min(CW * 0.6, 12 + 3.4 * Math.sqrt(nd));
      const [ox, oy] = centers[k], pts = [];
      while (pts.length < nd) {
        const a = rnd() * Math.PI * 2, d = R * Math.pow(rnd(), 0.62);
        const x = ox + Math.cos(a) * d, y = oy + Math.sin(a) * d * 0.82;
        if (x < 4 || x > CW - 4 || y < 4 || y > CH - 4) continue;
        pts.push([x, y, 0.9 + rnd() * 1.5]);
      }
      clouds.push({ pts, drawn: 0, color: k ? COLORS[k - 1] : BASE_COLOR, ox, oy });
    }
    run = { res, bounds, pos, seedAt, clouds, centers, wave: 0, idx: 0, t0: 0, raf: 0, lastLog: 0, done: false };
    $("field").querySelectorAll(".node").forEach((n) => n.remove());
    state.picks.forEach((w, i) => {
      const el = document.createElement("div");
      el.className = "node"; el.lang = "en";
      el.style.left = (centers[i + 1][0] / CW * 100) + "%";
      el.style.top = (centers[i + 1][1] / CH * 100) + "%";
      el.style.color = COLORS[i];
      el.innerHTML = `<i style="background:${COLORS[i]}"></i>${esc(w)}`;
      $("field").appendChild(el);
    });
    $("ticker").textContent = "";
    $("fill-btn").disabled = false;
    renderFillStatic();
    $("fill-btn").focus();
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || document.hidden) finishFill();
    else run.raf = requestAnimationFrame(tick);
  }

  // 波 k の点を、その波で到達した割合 f まで描く
  function drawCloud(k, f) {
    const c = run.clouds[k], upto = Math.round(c.pts.length * f);
    if (upto <= c.drawn) return;
    cx.save();
    cx.scale(DPR, DPR);
    cx.strokeStyle = c.color;
    cx.fillStyle = c.color;
    for (let i = c.drawn; i < upto; i++) {
      const [x, y, r] = c.pts[i];
      if (i % 5 === 0) {
        cx.globalAlpha = 0.07;
        cx.lineWidth = 0.6;
        cx.beginPath(); cx.moveTo(c.ox, c.oy); cx.lineTo(x, y); cx.stroke();
      }
      cx.globalAlpha = 0.6;
      cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill();
    }
    cx.restore();
    c.drawn = upto;
  }

  const waveDur = (n) => Math.min(4200, Math.max(650, 500 + n * 0.04));
  function tick(now) {
    if (!run || run.done) return;
    const { bounds, res } = run;
    if (!run.t0) run.t0 = now;
    // 波0は機能語だけで読める語、波1..8は種語ごとの連鎖
    const a = run.wave === 0 ? 0 : bounds[run.wave - 1], b = bounds[run.wave];
    const n = b - a, dur = waveDur(n);
    const x = Math.min(1, (now - run.t0) / dur);
    const target = a + Math.round(n * (1 - Math.pow(1 - x, 2)));
    if (target > run.idx) {
      run.idx = target;
      if (now - run.lastLog > 260) { addLog(res.order[target - 1]); run.lastLog = now; }
    }
    drawCloud(run.wave, n ? (run.idx - a) / n : 1);
    setHud(run.idx, run.wave);
    if (x >= 1) {
      if (run.wave === SLOTS) return finishFill();
      run.wave++; run.t0 = now;
      showNode(run.wave);
      if (bounds[run.wave] > bounds[run.wave - 1]) addLog(res.order[run.idx]);
    }
    run.raf = requestAnimationFrame(tick);
  }
  function showNode(k) {
    const el = $("field").querySelectorAll(".node")[k - 1];
    if (el) el.classList.add("on");
  }
  function finishFill() {
    if (!run) return;
    cancelAnimationFrame(run.raf);
    run.done = true;
    run.idx = run.res.count;
    for (let k = 0; k <= SLOTS; k++) { drawCloud(k, 1); if (k) showNode(k); }
    run.wave = SLOTS;
    setHud(run.res.count, -1);
    if (!$("ticker").textContent) addLog(run.res.order[run.res.count - 1]);
    renderFillStatic();
    $("fill-btn").focus();
  }
  function stopFill() { if (run) { cancelAnimationFrame(run.raf); run = null; } }
  document.addEventListener("visibilitychange", () => { if (document.hidden && run && !run.done) finishFill(); });

  function openedBy(w) {
    if (run.seedAt.has(w)) return -2;
    const p = run.pos[w];
    for (let i = wsyn.off[w]; i < wsyn.off[w + 1]; i++) {
      const s = wsyn.data[i];
      let ok = true;
      for (let j = G.req.off[s]; j < G.req.off[s + 1]; j++) {
        const r = G.req.data[j];
        if (run.pos[r] < 0 || run.pos[r] >= p) { ok = false; break; }
      }
      if (ok) return s;
    }
    return -1;
  }
  // 最後に開いた語と、それを開いた定義を1行で出す（到達順から逆算した表示専用の値）
  function addLog(w) {
    const s = openedBy(w);
    let def = "";
    if (s === -2) def = t("seedTag");
    else if (s >= 0) def = DEFS ? DEFS[s] : Array.from(G.req.data.subarray(G.req.off[s], G.req.off[s + 1]), (r) => G.words[r]).join(", ");
    $("ticker").innerHTML = `<b>${esc(G.words[w])}</b> ← ${esc(def)}`;
  }
  function setHud(count, now) {
    $("fill-count").textContent = t("words")(fmt(count));
    $("fill-pct").textContent = `(${pct(count)})`;
    const wave = run ? run.wave : 0, B = run ? run.bounds : null;
    $("legend").innerHTML = state.picks.map((w, i) => {
      const k = i + 1, cls = k === now ? "now" : k <= wave ? "done" : "";
      const plus = B && k <= wave ? `+${fmt(B[k] - B[k - 1])}` : "";
      return `<li class="${cls}"><span class="dot" style="background:${COLORS[i]}"></span><span class="w"><span lang="en">${esc(w)}</span>${gloss(w)}</span><span class="plus">${plus}</span></li>`;
    }).join("");
  }
  function renderFillStatic() {
    const done = run && run.done;
    $("fill-title").textContent = done ? t("fillTitleDone") : t("fillTitle");
    $("bubble").textContent = done ? t("bubbleDone") : t("bubble");
    $("fill-state").textContent = done ? t("reached") : t("exploring");
    $("fill-btn").textContent = done ? t("toResult") : t("skip");
    setHud(run ? run.idx : 0, done || !run ? -1 : run.wave);
  }
  $("fill-btn").onclick = () => {
    if (!run) return;
    if (!run.done) finishFill();
    else { state.result = run.res.count; go("result"); }
  };

  // ---------- 結果 ----------
  function renderResult() {
    const n = state.result ?? 0;
    const same = BEST.every((w) => state.picks.includes(w));
    $("res-title").innerHTML = t("resTitle")(fmt(n));
    $("res-lead").textContent = t("resLead")(pct(n));
    $("chips").innerHTML = state.picks.map((w, i) =>
      `<span style="background:${tint(COLORS[i], 20)};color:color-mix(in srgb, ${COLORS[i]} 72%, black)"><span lang="en">${esc(w)}</span>${gloss(w)}</span>`).join("");
    $("res-pct").innerHTML = `${(n / TOTAL * 100).toFixed(1)}<small style="font-size:18px">%</small>`;
    $("res-frac").textContent = `${fmt(n)} / ${fmt(TOTAL)}`;
    const L = 2 * Math.PI * 84;
    $("arc").setAttribute("stroke-dasharray", `${(n / TOTAL * L).toFixed(1)} ${L.toFixed(1)}`);
    $("refs").innerHTML = REFS.map((r) => {
      const name = esc(t(r.key)) + (r.best ? `<small>${esc(t("bestNote"))}</small>` : "");
      const val = r.seeds ? t("refSeeds")(fmt(r.seeds)) : t("refVal")(fmt(r.n), pct(r.n));
      return `<li class="${r.best && same ? "match" : ""}"><span class="name">${name}</span><span class="val">${val}</span></li>`;
    }).join("");
  }
  $("again").onclick = () => go("desk");
  let toastTimer = 0;
  function toast(msg) { $("toast").textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").textContent = ""; }, 2400); }
  $("share").onclick = async () => {
    const n = state.result ?? 0;
    const text = t("shareText")(fmt(n), pct(n), state.picks.join(", "));
    const url = "https://konaito.github.io/words-of-words/";
    if (navigator.share) {
      try { await navigator.share({ title: "Words of Words", text, url }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(`${text} ${url}`); toast(t("copied")); } catch (e) { toast(t("copyFail")); }
  };

  // ---------- 戻る ----------
  $("back").onclick = () => go({ desk: "door", fill: "desk", result: "desk" }[state.screen] || "door");
  $("brand").onclick = () => go("door");

  // ---------- キー操作 ----------
  document.addEventListener("keydown", (e) => {
    const tag = e.target && e.target.tagName;
    const onButton = tag === "BUTTON", inInput = tag === "INPUT";
    if (e.key === "Escape") {
      e.preventDefault();
      if (!$("howto").hidden) $("howto-close").click(); else go("door");
      return;
    }
    if (inInput) return;
    if (state.screen === "door" && e.key === "Enter" && !onButton && $("howto").hidden) { e.preventDefault(); go("desk"); return; }
    if (state.screen === "desk" && e.key === "Backspace") {
      e.preventDefault();
      if (state.picks.length) { state.picks.pop(); renderDesk(); focusCard(state.focus); }
      return;
    }
    if (state.screen === "desk" && e.key === "Enter" && !onButton && state.picks.length === SLOTS) { e.preventDefault(); openBook(); return; }
    if (state.screen === "fill" && e.key === "Enter" && !onButton) { e.preventDefault(); $("fill-btn").click(); }
  });

  // ---------- 言語 ----------
  function loadLang() {
    try { const v = localStorage.getItem("wow-lang"); if (v === "ja" || v === "en") return v; } catch (e) {}
    return (navigator.language || "").startsWith("ja") ? "ja" : "en";
  }
  function setLang(l) {
    state.lang = l;
    try { localStorage.setItem("wow-lang", l); } catch (e) {}
    render();
  }
  document.querySelectorAll("[data-lang]").forEach((b) => { b.onclick = () => setLang(b.dataset.lang); });

  function start(data) {
    state.lang = data.lang || loadLang();
    if (Array.isArray(data.picks)) state.picks = data.picks.filter((w) => typeof w === "string").slice(0, SLOTS);
    fit();
    go(data.screen === "desk" ? "desk" : "door");
  }
  window.claude?.hot?.snapshot?.(() => ({ lang: state.lang, picks: state.picks, screen: state.screen }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
