<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>card</title>
<style>
/* 1200x630 のカード画像。tools/render_card.sh で game/card.png に書き出す。数値は move, use, person, place, cause, time, language, quality の実測値 */
:root { --bg: #f7f5f1; --panel: #fff; --line: #e6e1d8; --ink: #1f2937; --sub: #6b7280; --green: #1f7a5c;
  --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  --round: ui-rounded, "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", system-ui, sans-serif; }
html, body { margin: 0; width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
.card { position: absolute; inset: 0; color: var(--ink); font-family: var(--font); }
.title { position: absolute; left: 80px; top: 92px; font-family: var(--round); font-size: 78px; line-height: 1.05; }
.sub { position: absolute; left: 82px; top: 210px; font-size: 38px; line-height: 1.5; font-weight: 700; }
.chips { position: absolute; left: 82px; top: 380px; width: 560px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.chips span { height: 58px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
.donut { position: absolute; left: 740px; top: 120px; width: 380px; height: 380px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.3; }
.donut .in b { font-family: var(--round); font-size: 72px; }
.donut .in span { font-size: 21px; color: var(--sub); }
</style>
</head>
<body>
<div class="card">
  <div class="title">Words of Words</div>
  <div class="sub">8語だけで、<br>辞書を作れますか？</div>
  <div class="chips">
    <span style="background:#dde8f9;color:#3561a3">move</span><span style="background:#fce4ea;color:#ab5b6f">use</span><span style="background:#fdebdb;color:#ad6f37">person</span><span style="background:#dcf0e6;color:#3a8261">place</span>
    <span style="background:#e9e3f8;color:#6b549f">cause</span><span style="background:#fbf3d6;color:#a78523">time</span><span style="background:#d9f0f5;color:#2e8395">language</span><span style="background:#f2e5f7;color:#8b599c">quality</span>
  </div>
  <div class="donut">
    <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="#ebe7e0" stroke-width="18"/><circle cx="100" cy="100" r="84" fill="none" stroke="#4a86e0" stroke-width="18" stroke-linecap="round" stroke-dasharray="393.2 527.8"/></svg>
    <div class="in"><b>74.5%</b><span>94,836 / 127,223語</span></div>
  </div>
</div>
</body>
</html>
