<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>card</title>
<style>
/* 1200x630 のカード画像。tools/render_card.sh で game/card.png に書き出す。数値は最良の8語の実測値。答えが出ないよう、語は文字数だけ合わせたモザイクで描く */
:root { --bg: #f7f5f1; --panel: #fff; --line: #e6e1d8; --ink: #1f2937; --sub: #6b7280; --green: #1f7a5c;
  --font: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
  --round: ui-rounded, "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", system-ui, sans-serif; }
html, body { margin: 0; width: 1200px; height: 630px; background: var(--bg); overflow: hidden; }
.card { position: absolute; inset: 0; color: var(--ink); font-family: var(--font); }
.title { position: absolute; left: 80px; top: 92px; font-family: var(--round); font-size: 78px; line-height: 1.05; }
.sub { position: absolute; left: 82px; top: 210px; font-size: 38px; line-height: 1.5; font-weight: 700; }
.chips { position: absolute; left: 82px; top: 380px; width: 560px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.chips span { height: 58px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
.hint { position: absolute; left: 82px; top: 334px; font-size: 25px; font-weight: 700; color: var(--ink); }
.chips span { overflow: hidden; align-content: center; }
.chips i { width: 12px; height: 12px; }
.q { position: absolute; font-family: var(--round); font-size: 30px; color: rgba(255, 255, 255, 0.95); }
.donut { position: absolute; left: 740px; top: 120px; width: 380px; height: 380px; }
.donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.donut .in { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.3; }
.donut .in b { font-family: var(--round); font-size: 72px; }
.donut .in span { font-size: 21px; color: var(--sub); }
</style>
</head>
<body>
<div class="card">
  <div class="title">Words of Words</div>
  <div class="sub">8語だけで、<br>辞書を作れますか？</div>
  <div class="hint">74.5%に届く8語は、どれ？</div>
  <div class="chips">
    <span data-n="4" style="background:#dde8f9;color:#3561a3"></span><span data-n="3" style="background:#fce4ea;color:#ab5b6f"></span><span data-n="6" style="background:#fdebdb;color:#ad6f37"></span><span data-n="5" style="background:#dcf0e6;color:#3a8261"></span>
    <span data-n="5" style="background:#e9e3f8;color:#6b549f"></span><span data-n="4" style="background:#fbf3d6;color:#a78523"></span><span data-n="8" style="background:#d9f0f5;color:#2e8395"></span><span data-n="7" style="background:#f2e5f7;color:#8b599c"></span>
  </div>
  <div class="donut">
    <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="#ebe7e0" stroke-width="18"/><circle cx="100" cy="100" r="84" fill="none" stroke="#4a86e0" stroke-width="18" stroke-linecap="round" stroke-dasharray="393.2 527.8"/></svg>
    <div class="in"><b>74.5%</b><span>94,836 / 127,223語</span></div>
  </div>
</div>
<script>
// 文字数ぶんの幅に、チップの色の濃淡で四角を敷く（擬似乱数なので毎回同じ絵になる）
let a = 42;
const rnd = () => (a = (a * 1103515245 + 12345) % 2147483648) / 2147483648;
document.querySelectorAll(".chips span").forEach((el) => {
  const cols = Math.min(8, Math.max(3, +el.dataset.n)), c = el.style.color;
  el.style.display = "grid";
  el.style.gridTemplateColumns = `repeat(${cols}, 12px)`;
  el.style.justifyContent = "center";
  for (let i = 0; i < cols * 3; i++) {
    const b = document.createElement("i");
    b.style.background = `color-mix(in srgb, ${c} ${Math.round(20 + rnd() * 70)}%, white)`;
    el.appendChild(b);
  }
});
</script>
</body>
</html>
